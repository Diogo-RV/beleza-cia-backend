# Nome da aplicação
spring.application.name=beleza-cia-backend

# Configurações do PostgreSQL
# Configure DB_PASSWORD no ambiente; não grave senhas reais neste arquivo.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/manicure_BD}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:COLOQUE_SUA_SENHA_DO_POSTGRES_AQUI}

# Driver do PostgreSQL
spring.datasource.driver-class-name=org.postgresql.Driver

# Usa a porta fornecida pela hospedagem (PORT) ou 8080 no ambiente local.
server.port=${PORT:8080}

# Persiste sessoes de login no PostgreSQL, e nao na memoria da instancia Vercel.
# Execute database/03-spring-session-jdbc.sql UMA VEZ no Neon (e no banco local
# se quiser continuar testando o login com esta versao).
spring.session.jdbc.initialize-schema=never
spring.session.timeout=30m
